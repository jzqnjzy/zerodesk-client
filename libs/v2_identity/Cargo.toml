[package]
name = "v2_identity"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Clean-room ZeroDesk V2 (v1.2.3) device identity, P-256 low-S TBS certificates, and 12h X25519 static key rotation"

[workspace]

[dependencies]
hex = "0.4.3"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "1.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
