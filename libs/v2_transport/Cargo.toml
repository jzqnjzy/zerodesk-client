[package]
name = "v2_transport"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Clean-room ZeroDesk V2 (v1.2.3) channel-aware low-latency E2EE transport stack"

[workspace]

[dependencies]
aes-gcm = "0.10.3"
async-trait = "0.1"
bytes = "1.9"
chacha20poly1305 = "0.10.1"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
snow = { version = "0.10.0", features = ["risky-raw-split"] }
subtle = "2.6"
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
v2_identity = { path = "../v2_identity" }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
