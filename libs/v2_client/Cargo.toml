[package]
name = "v2_client"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Clean-room ZeroDesk V2 (v1.2.3) client runtime: Control-Plane HTTPS/HTTP, Signaling, Noise_IK access tunnel, UDP 28B + LEG_NACK + RS(6,4) + E2EE L3/L4, Dual TLS-443 fallback, and V2ServiceStream/V2LoopbackBridge seams"

[workspace]

[features]
default = []
test-utils = []

[dependencies]
base64 = "0.22.1"
bytes = "1.9"
hex = "0.4.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.16.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
snow = { version = "0.10.0", features = ["risky-raw-split"] }
thiserror = "1.0"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
v2_identity = { path = "../v2_identity" }
v2_transport = { path = "../v2_transport" }
webpki-roots = "1.0.12"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
rcgen = "0.13.2"
v2_client = { path = ".", features = ["test-utils"] }
