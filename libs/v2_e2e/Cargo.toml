[package]
name = "v2_e2e"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Headless ZeroDesk V2 Phase 2 desktop media (real scrap VP9/AV1) and P0 HID E2E library and verification runner"

[[bin]]
name = "zerodesk-desktop-e2e"
path = "src/bin/zerodesk-desktop-e2e.rs"

[features]
default = []
os-input = ["dep:enigo", "zerodesk_core/os-input"]

[dependencies]
base64 = "0.22.1"
bytes = "1.9"
enigo = { path = "../enigo", optional = true }
hex = "0.4"
rand_core = { version = "0.6.4", features = ["getrandom"] }
scrap = { path = "../scrap" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
v2_client = { path = "../v2_client", features = ["test-utils"] }
v2_identity = { path = "../v2_identity" }
v2_transport = { path = "../v2_transport" }
zerodesk_core = { path = "../zerodesk_core", features = ["e2e-fault-injection"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
